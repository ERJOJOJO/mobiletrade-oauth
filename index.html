<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Trade sign-in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e6e8ee; font: 16px system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    a { color: #fff; background: #2962ff; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <p>Returning to Mobile Trade…</p>
    <a id="open" href="#">Open Mobile Trade</a>
  </main>
  <script>
    // TradingView redirects here with ?code=...&state=... (or ?error=...).
    // Hand the same query string to the app. The code is useless without the
    // app's PKCE verifier, so nothing secret is exposed by this page.
    var target = 'mobiletrade://oauth' + window.location.search;
    document.getElementById('open').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
